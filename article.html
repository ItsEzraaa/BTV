<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel — Beyond The VAR</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>:root{--paper:#F1F3EE;--panel:#fff;--ink:#12160F;--yellow:#FFD400;--soft:#565C4F}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,sans-serif;line-height:1.75}header{background:var(--ink);color:white;border-bottom:4px solid var(--yellow);padding:20px}.wrap{max-width:900px;margin:auto;padding:0 24px}.logo{font-family:Anton,sans-serif;font-size:25px;text-transform:uppercase}.back{color:var(--yellow);font-size:13px}.article{background:var(--panel);border:2px solid var(--ink);margin:40px auto;padding:35px}h1{font-family:Anton,sans-serif;text-transform:uppercase;line-height:1.05;font-size:46px;margin:12px 0}.meta{font-family:'Space Mono',monospace;font-size:12px;color:var(--soft);margin-bottom:25px}.hero{width:100%;max-height:470px;object-fit:cover;margin-bottom:24px}.content img{max-width:100%}@media(max-width:600px){h1{font-size:34px}.article{padding:22px;margin-top:20px}}</style></head><body><header><div class="wrap"><a class="back" href="index.html">← Kembali ke beranda</a><div class="logo">Beyond The VAR</div></div></header><main class="wrap"><article id="article" class="article"><p>Memuat artikel...</p></article></main><script>const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));(async()=>{const slug=new URLSearchParams(location.search).get('slug'),box=document.getElementById('article');try{const r=await fetch(`data/articles.json?v=${Date.now()}`),d=await r.json(),a=(d.articles||[]).find(x=>x.slug===slug&&x.status!=='draft');if(!a)throw new Error('Artikel tidak ditemukan');document.title=`${a.title} — Beyond The VAR`;box.innerHTML=`${a.image?`<img class="hero" src="${esc(a.image)}" alt="${esc(a.title)}">`:''}<div>${esc(a.category||'Berita')}</div><h1>${esc(a.title)}</h1><div class="meta">${esc(a.author||'Redaksi BTV')} · ${new Date(a.date).toLocaleDateString('id-ID')} · ${esc(a.read_time||'')}</div><div class="content">${marked.parse(a.body||'')}</div>`}catch(e){box.innerHTML=`<h1>Artikel tidak ditemukan</h1><p>${esc(e.message)}</p>`}})();</script></body></html>
